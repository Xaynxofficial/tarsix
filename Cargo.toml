[workspace]
resolver = "2"
members = [
    "crates/as-core",
    "crates/as-memory",
    "crates/as-backend",
    "crates/as-cpu",
    "crates/as-tensor",
    "crates/as-graph",
    "crates/as-scheduler",
    "crates/as-autograd",
    "crates/as-nn",
    "crates/as-optim",
    "crates/as-train",
    "crates/as-io",
    "crates/as-hub",
    "crates/as-runtime",
    "crates/as-serve",
    "crates/as-dist",
    "crates/as-llm",
    "crates/as-vision",
    "crates/as-accel",
    "crates/as-metal",
    "crates/as-cuda",
    "crates/as-wasm",
    "crates/as-cli",
    "crates/as-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Independent AI Computing Infrastructure Contributors"]
repository = "https://github.com/Xaynxofficial/tarsix"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
